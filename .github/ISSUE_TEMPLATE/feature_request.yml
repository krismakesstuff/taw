name: Feature idea
description: Suggest a feature, command or key. Please open one of these before building a feature.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The job, not the solution yet. What's slow, awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it might work in taw. If it's a command or key, how you'd type it.
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself (wait for a yes on this issue first, and see CONTRIBUTING.md and CLA.md).

# Builds taw on Windows and macOS and runs the self-tests that need no audio device.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-tests
        shell: bash
        run: |
          taw=build/taw_artefacts/Release/taw.exe
          "$taw" --version
          "$taw" --keycasttest
          "$taw" --counttest
          "$taw" --livetest
          "$taw" --cliptest
          "$taw" --paralleltest
          # (no --bouncetest: Windows Server images may lack the MP3 encoder)

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: FFmpeg (video)
        run: brew install ffmpeg

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-tests
        run: |
          taw=build/taw_artefacts/Release/taw
          "$taw" --version
          "$taw" --keytest
          "$taw" --keycasttest
          "$taw" --counttest
          "$taw" --livetest
          "$taw" --cliptest
          "$taw" --paralleltest
          "$taw" --bouncetest "$RUNNER_TEMP/bouncetest"
